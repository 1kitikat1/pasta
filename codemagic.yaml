workflows:
  xternalz-build:
    name: XternalZ TrollStore Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Theos and Compile Tweak
        script: |
          echo "=== Установка Theos SDK ==="
          rm -rf ./theos
          git clone --recursive https://github.com/1kitikat1/pasta ./theos
          
          echo "=== Скачивание iOS SDK ==="
          # Явно принуждаем curl сохранить файл под конкретным именем
          curl -sL "https://github.com/1kitikat1/pasta" -o iPhoneOS14.5.sdk.tar.xz
          
          # Проверяем, скачался ли файл, чтобы не упасть дальше
          if [ ! -f "iPhoneOS14.5.sdk.tar.xz" ]; then
            echo "❌ Ошибка: SDK файл не был скачан!"
            exit 1
          fi
          
          tar -xf iPhoneOS14.5.sdk.tar.xz -C ./theos/sdks/
          rm iPhoneOS14.5.sdk.tar.xz
          
          export THEOS=$(pwd)/theos
          echo "Установленный путь THEOS: $THEOS"
          
          echo "=== Запуск компиляции XternalZ ==="
          make package FINALPACKAGE=1 THEOS=$THEOS
          
          echo "=== Проверка собранного пакета ==="
          mkdir -p build/ios
          
          cp packages/*.tipa build/ios/ 2>/dev/null || cp packages/*.deb build/ios/ 2>/dev/null || true
          
          APP_DIR=$(find .theos/obj/ -name "*.app" -type d | head -n 1)
          if [ -d "$APP_DIR" ]; then
            echo "✅ Найдена скомпилированная папка приложения: $APP_DIR"
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            zip -r build/ios/XternalZ.ipa Payload/
            zip -r build/ios/XternalZ.tipa Payload/
          fi
    artifacts:
      - build/ios/*.ipa
      - build/ios/*.tipa
      - build/ios/*.deb
