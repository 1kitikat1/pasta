workflows:
  xternalz-build:
    name: XternalZ TrollStore Build
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Setup Theos and iOS SDK
        script: |
          echo "=== Установка Theos SDK ==="
          # Разворачиваем Theos в домашней папке пользователя, где запись разрешена
          export THEOS=$HOME/theos
          rm -rf $THEOS
          git clone --recursive https://github.com $THEOS
          
          echo "=== Скачивание iOS SDK ==="
          curl -LO https://github.com
          tar -xf iPhoneOS14.5.sdk.tar.xz -C $THEOS/sdks/
          rm iPhoneOS14.5.sdk.tar.xz
          
          # Намертво сохраняем переменную окружения для следующих шагов
          echo "export THEOS=$THEOS" >> $CM_ENV
      - name: Build XternalZ TIPA
        script: |
          # Подтягиваем путь к Theos
          export THEOS=$HOME/theos
          
          echo "=== Запуск компиляции XternalZ ==="
          # Передаем правильный путь напрямую в Makefile
          make package FINALPACKAGE=1 THEOS=$THEOS
          
          # Сохраняем скомпилированные файлы для отправки в артефакты сайта
          cp packages/*.tipa ./ 2>/dev/null || cp packages/*.deb ./ 2>/dev/null || true
    artifacts:
      - "*.tipa"
      - "*.deb"
      - "packages/*"
