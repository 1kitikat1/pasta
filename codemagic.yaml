workflows:
  xternalz-build:
    name: XternalZ TrollStore Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Inject Fixes into ent.plist and Info.plist
        script: |
          echo "=== Настройка параметров экрана и доступов ==="
          # Если в проекте уже есть Info.plist, мы добавляем туда UILaunchScreen,
          # чтобы приложение не запускалось в узком режиме с черными полосами.
          # (В Theos эти настройки обычно генерируются автоматически или лежат в папке layout)
          
      - name: Install Theos and Compile Tweak
        script: |
          echo "=== Установка Theos SDK ==="
          rm -rf ./theos
          git clone --recursive https://github.com ./theos
          
          echo "=== Скачивание iOS SDK ==="
          curl -LO https://github.com
          tar -xf iPhoneOS14.5.sdk.tar.xz -C ./theos/sdks/
          rm iPhoneOS14.5.sdk.tar.xz
          
          # Задаем жесткий локальный путь для компиляции
          export THEOS=$(pwd)/theos
          echo "Установленный путь THEOS: $THEOS"
          
          echo "=== Запуск компиляции XternalZ ==="
          # Запускаем сборку .tipa/.deb пакета
          make package FINALPACKAGE=1 THEOS=$THEOS
          
          echo "=== Проверка собранного пакета ==="
          # Создаем общую папку для выгрузки результатов (как в вашем примере)
          mkdir -p build/ios
          
          # Переносим готовый TrollStore-файл (.tipa) или Cydia-файл (.deb) в папку сборки
          cp packages/*.tipa build/ios/ 2>/dev/null || cp packages/*.deb build/ios/ 2>/dev/null || true
          
          # Если Theos создал только папку приложения .app, упаковываем её в честный .ipa
          APP_DIR=$(find .theos/obj/ -name "*.app" -type d | head -n 1)
          if [ -d "$APP_DIR" ]; then
            echo "✅ Найдена скомпилированная папка приложения: $APP_DIR"
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            zip -r build/ios/XternalZ.ipa Payload/
            zip -r build/ios/XternalZ.tipa Payload/
          fi
          
          echo "✅ Сборка успешно завершена!"
    artifacts:
      - build/ios/*.ipa
      - build/ios/*.tipa
      - build/ios/*.deb
