workflows:
  standoff-launcher-build:
    name: Standoff 2 Launcher IPA Build
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branches:
        - main
    scripts:
      - name: Setup Theos SDK
        script: |
          echo "=== Установка Theos SDK ==="
          export THEOS=$HOME/theos
          git clone --recursive https://github.com $THEOS
          
          echo "=== Скачивание iOS SDK ==="
          curl -LO https://github.com
          tar -xf iPhoneOS14.5.sdk.tar.xz -C $THEOS/sdks/
          rm iPhoneOS14.5.sdk.tar.xz
          
          echo "export THEOS=$THEOS" >> $CM_ENV
      - name: Build Application and Package to IPA
        script: |
          echo "=== Сборка приложения ==="
          # Собираем проект в релизном режиме
          make clean package FINALPACKAGE=1
          
          echo "=== Упаковка в .ipa/.tipa для TrollStore ==="
          # Находим скомпилированную папку приложения .app
          APP_DIR=$(find .theos/obj/ -name "*.app" -type d | head -n 1)
          
          if [ -d "$APP_DIR" ]; then
            # Создаем структуру для классического IPA
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            
            # Упаковываем в .ipa и дублируем как .tipa (для совместимости)
            zip -r StandoffLauncher.ipa Payload
            cp StandoffLauncher.ipa StandoffLauncher.tipa
            echo "Сборка IPA успешно завершена!"
          else
            echo "Ошибка: папка .app не найдена. Проверьте ваш Makefile."
            exit 1
          fi
    artifacts:
      - "*.ipa"
      - "*.tipa"
      - "packages/*.deb"
