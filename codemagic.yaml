workflows:
  xternalz-build:
    name: XternalZ TrollStore Build
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Setup Theos and iOS SDK
        script: |
          echo "=== Установка Theos SDK ==="
          # Клонируем Theos в корень диска, как прописано во многих Makefile
          sudo mkdir -p /theos
          sudo chown -R $(whoami) /theos
          git clone --recursive https://github.com /theos
          
          echo "=== Скачивание iOS SDK ==="
          curl -LO https://github.com
          tar -xf iPhoneOS14.5.sdk.tar.xz -C /theos/sdks/
          rm iPhoneOS14.5.sdk.tar.xz
          
          # Экспортируем переменные окружения
          echo "export THEOS=/theos" >> $CM_ENV
          echo "export THEOS=/theos" >> ~/.bash_profile
      - name: Build XternalZ TIPA
        script: |
          export THEOS=/theos
          
          echo "=== Запуск компиляции XternalZ ==="
          # Проект XternalZ сам собирает .tipa при вызове этой команды
          make package FINALPACKAGE=1
          
          # Копируем готовый файл в корень для отправки в артефакты
          cp packages/*.tipa ./ 2>/dev/null || cp packages/*.deb ./ 2>/dev/null || true
    artifacts:
      - "*.tipa"
      - "*.deb"
      - "packages/*"
