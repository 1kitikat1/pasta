workflows:
  xternalz-build:
    name: XternalZ TrollStore Build
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Setup Theos and iOS SDK
        script: |
          echo "=== Установка Theos SDK локально ==="
          # Клонируем Theos прямо в рабочую директорию билда
          git clone --recursive https://github.com ./theos
          
          echo "=== Скачивание iOS SDK ==="
          curl -LO https://github.com
          tar -xf iPhoneOS14.5.sdk.tar.xz -C ./theos/sdks/
          rm iPhoneOS14.5.sdk.tar.xz
          
          # Сохраняем абсолютный путь к локальной папке
          echo "export THEOS=$PWD/theos" >> $CM_ENV
      - name: Build XternalZ TIPA
        script: |
          # Подтягиваем переменную
          export THEOS=$PWD/theos
          
          echo "=== Запуск компиляции XternalZ ==="
          # Принудительно передаем локальный путь в make
          make package FINALPACKAGE=1 THEOS=$THEOS
          
          # Копируем результаты для выгрузки в артефакты
          cp packages/*.tipa ./ 2>/dev/null || cp packages/*.deb ./ 2>/dev/null || true
    artifacts:
      - "*.tipa"
      - "*.deb"
      - "packages/*"
